# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo/branch.
services:
  - type: web
    name: blue-park
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: BLUEPARK_MODE
        value: demo
      - key: PUBLIC_BASE_URL
        sync: false        # set to the URL Render gives you, e.g. https://blue-park.onrender.com
      - key: ADMIN_PASSWORD
        sync: false        # set one so strangers can't open /admin on the public demo
      - key: SECURE_COOKIES
        value: "true"
